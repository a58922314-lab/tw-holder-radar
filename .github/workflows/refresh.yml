name: Weekly TDCC holding updates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh.py'
      - 'scripts/a1_institutional.py'
      - 'tests/a1-screening.test.cjs'
      - 'rules/a1-screening.js'
      - 'scripts/verify_snapshot.py'
      - 'tests/test_refresh.py'
      - '.github/workflows/refresh.yml'
  schedule:
    # UTC; Taiwan is UTC+8. Weekdays 18:30; Saturdays 11:30 and 18:30.
    - cron: '30 10 * * 1-5'
    - cron: '30 3,10 * * 6'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tdcc-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run data ingestion regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch official data and calculate rankings
        id: refresh
        run: python scripts/refresh.py
      - name: Validate resulting whole-market snapshots
        run: python scripts/verify_snapshot.py
      - name: Save downloaded data and weekly snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --staged --quiet; then
            git commit -m "data: update official market snapshots"
            # The main branch may have changed while APIs were downloading.
            # Replay our generated-data commit on the newest code before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate dashboard script syntax
        run: |
          python -c 'import pathlib,re; x=pathlib.Path("index.html").read_text(); m=re.search("<script>(.*?)</script>",x,re.S); assert m, "Missing inline dashboard script"; pathlib.Path("/tmp/radar.js").write_text(m.group(1))'
          node --check /tmp/radar.js
          node --check rules/d1-screening.js
          node --test tests/d1-screening.test.cjs
          node --check rules/a1-screening.js
          node --test tests/a1-screening.test.cjs
      - uses: actions/configure-pages@v5
      - name: Assemble published site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          mkdir -p _site/rules
          cp rules/d1-screening.js _site/rules/d1-screening.js
          cp rules/a1-screening.js _site/rules/a1-screening.js
          cp strategy-validation.html _site/strategy-validation.html
          cp strategy-validation.js _site/strategy-validation.js
          if [ -f data/auto_snapshots.json ]; then
            cp data/auto_snapshots.json _site/data/auto_snapshots.json
          else
            echo '{"snapshots":[]}' > _site/data/auto_snapshots.json
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish snapshot website
        id: deployment
        uses: actions/deploy-pages@v4
