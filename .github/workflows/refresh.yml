name: Weekly TDCC holding updates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh.py'
      - 'scripts/vcp_daily.py'
      - 'tests/test_vcp.py'
      - 'scripts/a1_institutional.py'
      - 'scripts/a1_archive_backfill.py'
      - 'tests/a1-screening.test.cjs'
      - 'tests/industry-flow.test.cjs'
      - 'tests/test_a1_coverage.py'
      - 'rules/a1-screening.js'
      - 'scripts/verify_snapshot.py'
      - 'tests/test_refresh.py'
      - '.github/workflows/refresh.yml'
  schedule:
    # UTC; Taiwan is UTC+8. Weekdays 18:30; Saturdays 11:30 and 18:30.
    - cron: '30 10 * * 1-5'
    - cron: '30 3,10 * * 6'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Both workflows deploy the same GitHub Pages environment.
  # Serialize them to prevent HTTP 400 "in progress deployment" collisions.
  group: holder-radar-site-and-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pending runs must start from the newest validated data on main.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run data ingestion regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch official data and calculate rankings
        id: refresh
        run: python scripts/refresh.py
      - name: Validate resulting whole-market snapshots
        run: python scripts/verify_snapshot.py
      - name: Save downloaded data and weekly snapshots
        # Never publish partial/invalid data on fetch or validation failure.
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot generation takes time; the default branch may move.
          # Stage only validated data on top of the newest main each attempt.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A data/
            if git diff --staged --quiet; then
              echo "No new official data."
              break
            fi
            git commit -m "data: update official market snapshots"
            if git push origin HEAD:main; then
              echo "Published validated official data."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push official data after 3 retries" >&2
              exit 1
            fi
          done
      - name: Validate dashboard script syntax
        run: |
          python -c 'import pathlib,re; x=pathlib.Path("index.html").read_text(); m=re.search("<script>(.*?)</script>",x,re.S); assert m, "Missing inline dashboard script"; pathlib.Path("/tmp/radar.js").write_text(m.group(1))'
          node --check /tmp/radar.js
          python -c 'import pathlib,re; x=pathlib.Path("vcp-radar.html").read_text(); m=re.search("<script>(.*?)</script>",x,re.S); assert m, "Missing VCP page script"; pathlib.Path("/tmp/vcp-radar.js").write_text(m.group(1))'
          node --check /tmp/vcp-radar.js
          python -m unittest discover -s tests -p 'test_vcp.py' -v
          node --check rules/d1-screening.js
          node --test tests/d1-screening.test.cjs
          node --check rules/a1-screening.js
          node --test tests/a1-screening.test.cjs
          node --test tests/industry-flow.test.cjs
          node --check rules/kelly-risk.js
          node --check kelly-risk.js
          node --test tests/kelly-risk.test.cjs
      - uses: actions/configure-pages@v5
      - name: Assemble published site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp vcp-radar.html _site/vcp-radar.html
          mkdir -p _site/rules
          cp rules/d1-screening.js _site/rules/d1-screening.js
          cp rules/a1-screening.js _site/rules/a1-screening.js
          cp strategy-validation.html _site/strategy-validation.html
          cp strategy-validation.js _site/strategy-validation.js
          cp kelly-risk.html _site/kelly-risk.html
          cp kelly-risk.js _site/kelly-risk.js
          cp rules/kelly-risk.js _site/rules/kelly-risk.js
          if [ -f data/auto_snapshots.json ]; then
            cp data/auto_snapshots.json _site/data/auto_snapshots.json
          else
            echo '{"snapshots":[]}' > _site/data/auto_snapshots.json
          fi
          if [ -f data/vcp_signals.json ]; then
            cp data/vcp_signals.json _site/data/vcp_signals.json
          else
            echo '{"candidateCount":0,"storedSessions":0,"eligibleStocks":0,"marketAsOf":{},"candidates":[]}' > _site/data/vcp_signals.json
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish snapshot website
        id: deployment
        uses: actions/deploy-pages@v4
