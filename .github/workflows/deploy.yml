name: Publish Holder Radar website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/auto_snapshots.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          if [ -f data/auto_snapshots.json ]; then
            cp data/auto_snapshots.json _site/data/auto_snapshots.json
          else
            echo '{"snapshots":[]}' > _site/data/auto_snapshots.json
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
