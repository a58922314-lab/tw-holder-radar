name: Publish Holder Radar website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vcp-radar.html'
      - 'scripts/vcp_daily.py'
      - 'tests/test_vcp.py'
      - 'data/vcp_signals.json'
      - 'rules/d1-screening.js'
      - 'rules/a1-screening.js'
      - 'tests/a1-screening.test.cjs'
      - 'tests/industry-flow.test.cjs'
      - 'tests/test_a1_coverage.py'
      - 'tests/d1-screening.test.cjs'
      - 'strategy-validation.html'
      - 'strategy-validation.js'
      - 'kelly-risk.html'
      - 'kelly-risk.js'
      - 'rules/kelly-risk.js'
      - 'tests/kelly-risk.test.cjs'
      - 'data/auto_snapshots.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Both workflows deploy the same GitHub Pages environment.
  # Serialize them to prevent HTTP 400 "in progress deployment" collisions.
  group: holder-radar-site-and-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued deploy must retain data committed by the preceding refresh.
          ref: main
      - name: Validate dashboard script syntax
        run: |
          python -c 'import pathlib,re; x=pathlib.Path("index.html").read_text(); m=re.search("<script>(.*?)</script>",x,re.S); assert m, "Missing inline dashboard script"; pathlib.Path("/tmp/radar.js").write_text(m.group(1))'
          node --check /tmp/radar.js
          python -c 'import pathlib,re; x=pathlib.Path("vcp-radar.html").read_text(); m=re.search("<script>(.*?)</script>",x,re.S); assert m, "Missing VCP page script"; pathlib.Path("/tmp/vcp-radar.js").write_text(m.group(1))'
          node --check /tmp/vcp-radar.js
          python -m unittest discover -s tests -p 'test_vcp.py' -v
          node --check rules/d1-screening.js
          node --test tests/d1-screening.test.cjs
          node --check rules/a1-screening.js
          node --test tests/a1-screening.test.cjs
          node --test tests/industry-flow.test.cjs
          node --check rules/kelly-risk.js
          node --check kelly-risk.js
          node --test tests/kelly-risk.test.cjs
      - uses: actions/configure-pages@v5
      - name: Assemble website
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp vcp-radar.html _site/vcp-radar.html
          mkdir -p _site/rules
          cp rules/d1-screening.js _site/rules/d1-screening.js
          cp rules/a1-screening.js _site/rules/a1-screening.js
          cp strategy-validation.html _site/strategy-validation.html
          cp strategy-validation.js _site/strategy-validation.js
          cp kelly-risk.html _site/kelly-risk.html
          cp kelly-risk.js _site/kelly-risk.js
          cp rules/kelly-risk.js _site/rules/kelly-risk.js
          if [ -f data/auto_snapshots.json ]; then
            cp data/auto_snapshots.json _site/data/auto_snapshots.json
          else
            echo '{"snapshots":[]}' > _site/data/auto_snapshots.json
          fi
          if [ -f data/vcp_signals.json ]; then
            cp data/vcp_signals.json _site/data/vcp_signals.json
          else
            echo '{"candidateCount":0,"storedSessions":0,"eligibleStocks":0,"marketAsOf":{},"candidates":[]}' > _site/data/vcp_signals.json
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
