name: D1 momentum radar checks
on:
  pull_request:
    paths:
      - 'scripts/momentum_daily.py'
      - 'scripts/momentum_backtest.py'
      - 'tests/test_momentum.py'
      - 'momentum-radar.html'
      - 'rules/momentum-week.js'
      - 'tests/momentum-week.test.cjs'
      - '.github/workflows/momentum-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate momentum model
        run: python -m unittest discover -s tests -p 'test_momentum.py' -v
      - name: Verify historical official D1 week selection
        run: |
          node --check rules/momentum-week.js
          node --test tests/momentum-week.test.cjs
      - name: Generate real signals from stored official day bars
        run: |
          python scripts/momentum_daily.py
          python -c 'import json; r=json.load(open("data/momentum_signals.json",encoding="utf-8")); print("coverage=",r["evaluatedStocks"],"today=",r["originalSignals"],"3day=",r["recent3Signals"]); assert "assessments" in r and r["evaluatedStocks"] >= 0'
      - name: Exploratory A/B simulation using saved daily candles
        run: python scripts/momentum_backtest.py
      - name: Validate JavaScript embedded in momentum radar
        run: |
          python -c 'import pathlib,re; s=pathlib.Path("momentum-radar.html").read_text(); parts=re.findall(r"<script>(.*?)</script>",s,re.S); assert parts, "Missing inline script"; pathlib.Path("/tmp/momentum.js").write_text(parts[-1])'
          node --check /tmp/momentum.js
