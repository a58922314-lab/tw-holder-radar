name: Strategy validation integration checks
on:
  pull_request:
    paths:
      - 'strategy-validation.html'
      - 'strategy-validation.js'
      - 'tests/test_strategy_validation.cjs'
      - '.github/workflows/strategy-validation-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check strategy-validation.js
      - run: node tests/test_strategy_validation.cjs
