function svgChart(data){let w=780,h=292,m={top:28,right:18,bottom:45,left:47},vals=data.flatMap(d=>[d.buy,d.sell]);let min=Math.floor((Math.min(...vals)-2)/5)*5,max=Math.ceil((Math.max(...vals)+2)/5)*5;let X=i=>m.left+i*(w-m.left-m.right)/(data.length-1),Y=v=>m.top+(max-v)*(h-m.top-m.bottom)/(max-min),path=k=>data.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d[k]).toFixed(1)).join(' ');let ticks=Array.from({length:5},(_,i)=>min+(max-min)*i/4);return `<svg class="chartsvg" viewBox="0 0 ${w} ${h}" role="img" aria-label="12週大戶買組與賣組等權報酬折線圖">${ticks.map(t=>`<line x1="${m.left}" x2="${w-m.right}" y1="${Y(t)}" y2="${Y(t)}" stroke="#394047" stroke-dasharray="3 5"/><text x="${m.left-11}" y="${Y(t)+4}" fill="#8e9399" font-size="12" text-anchor="end">${t.toFixed(0)}%</text>`).join('')}${data.map((d,i)=>`<text x="${X(i)}" y="${h-15}" fill="#9da5ad" font-size="12" text-anchor="middle">${d.week}</text>`).join('')}<path d="${path('buy')}" fill="none" stroke="#ef9094" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="${path('sell')}" fill="none" stroke="#32bd87" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.buy)}" r="4.5" fill="#ef9094"><title>${d.week} 買組 ${d.buy}%</title></circle><circle cx="${X(i)}" cy="${Y(d.sell)}" r="4.5" fill="#32bd87"><title>${d.week} 賣組 ${d.sell}%</title></circle>`).join('')}</svg>`}
function renderHistory(){let w=db.weeks,buyAvg=avg(w,'buy'),sellAvg=avg(w,'sell'),wins=w.filter(x=>x.buy>x.sell).length;return title('12 週策略觀察','原圖片每週不同名單的買組與賣組等權報酬，僅為歷史回顧。','W1 — W12')+`<div class="kpis">${stat('買組每週平均',nfmt(buyAvg,2,'%'),'12 週算術平均',color(buyAvg))}${stat('賣組每週平均',nfmt(sellAvg,2,'%'),'12 週算術平均',color(sellAvg))}${stat('買組勝過賣組',wins+' / '+w.length+' 週','同週比較；平手不計勝週','')}${stat('買賣組平均差',nfmt(buyAvg-sellAvg,2,' pp'),'平均買組 − 平均賣組',color(buyAvg-sellAvg))}</div><div class="panel pad"><h3 class="section-title">買賣組週報酬曲線</h3><div class="legend"><span><i style="background:#ef9094"></i>大戶買組</span><span><i style="background:#32bd87"></i>大戶賣組</span></div>${svgChart(w)}<div class="hint">不同週股票名單會變更；折線呈現逐週報酬，不是固定持股的淨值曲線。</div></div><div style="height:16px"></div><div class="panel pad"><h3 class="section-title">逐週比較</h3><div class="table-wrap" style="border:1px solid var(--line);border-radius:10px"><table class="stocktable" style="min-width:470px"><thead><tr><th>週別</th><th>買組週報酬</th><th>賣組週報酬</th><th>買組領先</th></tr></thead><tbody>${w.map(o=>`<tr><td>${o.week}</td><td>${nfmt(o.buy,1,'%')}</td><td>${nfmt(o.sell,1,'%')}</td><td>${nfmt(o.buy-o.sell,1,' pp')}</td></tr>`).join('')}</tbody></table></div></div><div class="alert warning" style="margin-top:15px">原圖列示的平均數字可能涉及不同加總或四捨五入規則，本系統依實際列出的 W1–W12 逐週數值重新計算，並以此為準。不可視為可交易的回測績效。</div>`}
function renderManage(){let ss=[...db.snapshots].reverse();return title('資料與週報管理','正式部署後，排程於每個交易日封存行情、每週更新集保資料；也可自行匯入 CSV。','V2 官方週報')+`<div class="two-col"><section class="panel pad"><h3 class="section-title">匯入新一週 CSV</h3><p class="section-desc">支援 UTF-8 (含 BOM) CSV，欄位名稱固定；不需要 Excel。</p><div class="upload-area"><div style="font-size:29px;margin-bottom:10px">⬆</div><p style="margin:0 0 15px">選擇你準備的週籌碼 CSV 檔案</p><input id="csvFile" type="file" accept=".csv,text/csv"/></div><div class="pill-row"><button class="button" id="templateCsv">↓ 下載空白 CSV 範本</button><button class="button" id="currentCsv">↓ 匯出目前資料 CSV</button></div><div class="hint">必要欄位：<code>snapshot_date, code, name, holder_delta_pp</code>；其他欄位可選。若未提供 <code>prior_holder_delta_pp</code>，且有上一個快照，可自動對應前一週變動。CSV 匯入會預覽、驗證後才寫入。</div><div id="importPreview"></div></section><section class="panel pad"><h3 class="section-title">已儲存週別</h3><p class="section-desc">自行匯入會儲存於瀏覽器，官方定期同步資料存於已部署的網站。</p><div class="stack">${ss.map(s=>`<div class="rowdetail"><div><strong>${esc(s.date)}</strong> ${s.type==='built-in'?'<span class="tag">內建樣本</span>':s.type==='auto'?'<span class="tag green">官方定期同步</span>':'<span class="tag">自行匯入</span>'}<div class="hint">${s.records.length} 檔　·　對比 ${esc(s.compareDate||'待定')}</div></div><button class="button ${s.date===state.snapshot?'gold':''}" data-snapshot="${esc(s.date)}">${s.date===state.snapshot?'檢視中':'檢視'}</button></div>`).join('')}</div><div class="alert warning" style="margin-top:24px">「同步線上週報」只讀取網站已發布的最新檔案。新資料由伺服器端 GitHub Actions 定期取得；單機 HTML 無法排程。登入 GitHub Pages 並啟用排程後才有真正的全市場更新。</div><button class="button danger" id="resetApp" style="margin-top:22px">清除本機匯入與收藏（不刪除網站官方週報）</button></section></div>`}
function nav(){document.getElementById('nav').innerHTML=menu.map(([id,ic,label])=>`<button class="navbtn ${state.tab===id?'active':''}" data-navigate="${id}"><span class="navicon">${ic}</span>${label}</button>`).join('');document.getElementById('breadcrumbs').textContent=menu.find(x=>x[0]===state.tab)?.[2]||'總覽';document.getElementById('snapshotPicker').innerHTML=db.snapshots.map(s=>`<option value="${esc(s.date)}" ${s.date===state.snapshot?'selected':''}>${esc(s.date)} · ${s.records.length}檔</option>`).join('')}
function render(){nav();let app=document.getElementById('app');app.className='view';app.innerHTML=({overview:renderOverview,gain:()=>renderListing('gain'),loss:()=>renderListing('loss'),flow:renderFlow,search:renderSearch,watch:renderWatch,history:renderHistory,manage:renderManage}[state.tab]||renderOverview)();let fp=document.getElementById('flagPicker');if(fp)fp.value=state.flag;}
function openDetail(code){let r=records().find(x=>x.code===code);if(!r)return;let cat=classify(r);document.getElementById('overlay').innerHTML=`<div class="drawerbg" id="drawerbg"><aside class="drawer" role="dialog" aria-label="個股籌碼詳細資訊"><button class="close" id="closeDrawer">×</button><div class="eyebrow">STOCK HOLDER PROFILE</div><h2 style="font-size:32px;margin:15px 0 4px"><span style="color:var(--gold)">${esc(r.code)}</span>　${esc(r.name)}</h2><p class="muted">${esc(snapshot().date)} 資料　·　${r.rank?`榜內排名 #${r.rank}`:'補充換手樣本'}</p><div class="pill-row"><span class="pill">${cat}</span>${r.top?`<span class="tag">${r.top==='gain'?'週增 TOP50':'週減 TOP50'}</span>`:''}${r.tags?`<span class="tag">${esc(r.tags)}</span>`:''}</div><div class="detailgrid" style="margin:23px 0"><div class="detailbox"><div class="muted">上週大戶變動</div><div class="num">${nfmt(r.priorDelta,2,' pp')}</div></div><div class="detailbox"><div class="muted">本週大戶變動</div><div class="num">${nfmt(r.delta,2,' pp')}</div></div><div class="detailbox"><div class="muted">本週股價變化</div><div class="num">${nfmt(r.returnPct,1,'%')}</div></div><div class="detailbox"><div class="muted">大戶變化加速度</div><div class="num">${nfmt(isNum(r.priorDelta)?r.delta-r.priorDelta:null,2,' pp')}</div></div></div><div class="panel pad"><h3 class="section-title">持股結構變化</h3>${[['400張以上大戶',r.delta,' pp'],['千張以上大戶',r.kilo,' pp'],['散戶持股比例',r.retail,' pp'],['股東人數',r.owners,' 人'],['券資比',r.margin,'%']].map(([l,n,u])=>`<div class="rowdetail"><span class="muted">${l}</span><strong>${u===' 人'?n==null?'—':(n>0?'+':'')+compact(n)+' 人':(u==='%'?n==null?'—':typeof n==='number'?n.toFixed(1)+'%':esc(n):nfmt(n,2,u))}</strong></div>`).join('')}</div><p class="hint">「大戶變動」為持股級距占比變化，無法單獨判定主力買賣、公司做帳或下一週股價方向。</p><button class="button gold" id="detailStar" data-star="${r.code}" style="width:100%;margin-top:8px">${db.watch.includes(r.code)?'★ 從追蹤移除':'☆ 加入我的追蹤'}</button><button class="button" id="closeBottom" style="width:100%;margin-top:9px">關閉</button></aside></div>`;}
function download(filename,content){let blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
const csvKeys=['snapshot_date','code','name','holder_delta_pp','prior_holder_delta_pp','thousand_delta_pp','retail_delta_pp','shareholder_change','margin_ratio_pct','weekly_return_pct','tags'];
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportRows(rs,date){let lines=[csvKeys.join(',')];rs.forEach(r=>lines.push([date,r.code,r.name,r.delta,r.priorDelta,r.kilo,r.retail,r.owners,r.margin,r.returnPct,r.tags].map(csvCell).join(',')));return lines.join('\r\n')}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quote=false;for(let i=0;i<t.length;i++){let c=t[i];if(quote){if(c==='"'&&t[i+1]==='"'){cell+='"';i++}else if(c==='"'){quote=false}else cell+=c}else if(c==='"'){quote=true}else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else{cell+=c}}if(quote)throw Error('CSV 引號沒有正確結束');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function validateImport(txt){let arr=parseCSV(txt);if(arr.length<2)throw Error('檔案沒有資料列');let heads=arr[0].map(x=>x.trim().toLowerCase());for(let k of ['snapshot_date','code','name','holder_delta_pp'])if(!heads.includes(k))throw Error('缺少必要欄位：'+k);let dates=new Set(),seen=new Set(),items=[],issues=[];for(let i=1;i<arr.length;i++){let line=Object.fromEntries(heads.map((k,j)=>[k,(arr[i][j]||'').trim()]));let date=line.snapshot_date,code=line.code;let name=line.name;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))issues.push('第'+(i+1)+'列日期格式須為 YYYY-MM-DD');dates.add(date);if(!/^\d{4,6}$/.test(code))issues.push('第'+(i+1)+'列股票代號不正確');if(seen.has(code))issues.push('重複代號：'+code);seen.add(code);if(!name)issues.push('第'+(i+1)+'列缺少股票名稱');let numeric=k=>{let v=line[k];if(v==null||v==='')return null;if(k==='margin_ratio_pct'&&v==='<1')return '<1';let n=Number(v.replace(/,/g,''));if(!Number.isFinite(n)){issues.push('第'+(i+1)+'列 '+k+' 非數字');return null}return n};let delta=numeric('holder_delta_pp');if(delta==null)issues.push('第'+(i+1)+'列缺本週大戶數據');items.push({code,name,rank:null,top:null,delta,priorDelta:numeric('prior_holder_delta_pp'),kilo:numeric('thousand_delta_pp'),retail:numeric('retail_delta_pp'),owners:numeric('shareholder_change'),margin:numeric('margin_ratio_pct'),returnPct:numeric('weekly_return_pct'),tags:line.tags||'',source:'使用者匯入CSV'});}if(dates.size>1)issues.push('一份檔案只能包含同一個 snapshot_date');let date=[...dates][0];let older=db.snapshots.filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];if(older&&(new Date(date+'T00:00:00Z')-new Date(older.date+'T00:00:00Z'))/86400000>10)older=null;let oldMap=new Map((older?.records||[]).map(r=>[r.code,r]));items.forEach(r=>{if(r.priorDelta==null){let x=oldMap.get(r.code);if(x&&isNum(x.delta))r.priorDelta=x.delta}});if(issues.length)throw Error(issues.slice(0,12).join('\n')+(issues.length>12?'\n…共 '+issues.length+' 個錯誤':''));items.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,50).forEach((r,i)=>{r.top='gain';r.rank=i+1});items.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,50).forEach((r,i)=>{r.top='loss';r.rank=i+1});return {date,compareDate:older?.date||null,label:date+' 匯入',type:'import',source:'使用者自行匯入 CSV，請自行核對來源',records:items};}
function previewImport(im){return `<div class="alert" style="margin-top:16px"><strong>驗證成功：</strong>${esc(im.date)}，${im.records.length} 檔；${im.records.filter(r=>classify(r)!=='未分類').length} 檔可依目前門檻直接分類。${im.compareDate?'對照上一快照 '+esc(im.compareDate):'暫無上一快照，需提供前週數據才能做四類換手。'}</div><div style="display:flex;gap:10px;margin-top:14px"><button class="button gold" id="confirmImport">確認寫入這一週</button><button class="button" id="cancelImport">取消</button></div>`}
function rerenderPreserve(id,val){render();let e=document.getElementById(id);if(e){e.focus();e.setSelectionRange?.(val.length,val.length)}}
document.addEventListener('click',e=>{let s=e.target.closest('[data-star]');if(s){e.stopPropagation();const id=s.dataset.star;db.watch=db.watch.includes(id)?db.watch.filter(c=>c!==id):[...db.watch,id];save();let overlay=!!document.getElementById('drawerbg');render();if(overlay)openDetail(id);return;}let navel=e.target.closest('[data-navigate]');if(navel){state.tab=navel.dataset.navigate;state.query='';state.flag='全部';state.sort='delta';state.desc=true;render();window.scrollTo({top:0,behavior:'smooth'});return}let ss=e.target.closest('[data-snapshot]');if(ss){state.snapshot=ss.dataset.snapshot;state.tab='overview';state.query='';render();return}let stock=e.target.closest('[data-code]');if(stock){openDetail(stock.dataset.code);return}let cc=e.target.closest('[data-cat]');if(cc){state.cat=cc.dataset.cat;render();return}let col=e.target.closest('[data-sort]');if(col){let k=col.dataset.sort;if(state.sort===k)state.desc=!state.desc;else{state.sort=k;state.desc=k!=='name'}render();return}switch(e.target.id){case'quickImport':state.tab='manage';render();break;case'refreshAuto':loadPublished(true);break;case'exportCurrent':{let rs;if(state.tab==='gain'||state.tab==='loss')rs=topRecords(state.tab);else if(state.tab==='flow')rs=records().filter(r=>categories.includes(classify(r))&&(state.cat==='全部'||classify(r)===state.cat));else if(state.tab==='watch')rs=records().filter(r=>db.watch.includes(r.code));else rs=records();download(`大戶籌碼_${snapshot().date}_${state.tab}.csv`,exportRows(applyFilter(rs),snapshot().date));break}case'currentCsv':download('大戶籌碼_'+snapshot().date+'.csv',exportRows(records(),snapshot().date));break;case'templateCsv':download('大戶籌碼匯入範本.csv',csvKeys.join(',')+'\r\n'+['2026-10-23','6278','台表科','2.50','5.48','2.00','-2.50','-100','5.3','1.2','測試資料請刪除'].map(csvCell).join(','));break;case'clearFilters':state.query='';state.flag='全部';state.onlySave=false;render();break;case'confirmImport':if(parsedImport){db.snapshots=db.snapshots.filter(s=>s.date!==parsedImport.date);db.snapshots.push(parsedImport);db.snapshots.sort((a,b)=>a.date.localeCompare(b.date));state.snapshot=parsedImport.date;save();parsedImport=null;state.tab='overview';render();alert('資料已匯入！系統已切換到 '+state.snapshot+'。')}break;case'cancelImport':parsedImport=null;document.getElementById('importPreview').innerHTML='';break;case'resetApp':if(confirm('將清除自行匯入的週別與收藏，並還原內建圖片快照。確定嗎？')){db=JSON.parse(JSON.stringify(SEED));db.watch=[];state.snapshot=SEED.snapshots[0].date;save();render();loadPublished(false);}break;case'closeDrawer':case'closeBottom':document.getElementById('overlay').innerHTML='';break;case'drawerbg':if(e.target.id==='drawerbg')document.getElementById('overlay').innerHTML='';break;}});
document.addEventListener('input',e=>{if(['tableSearch','globalSearch'].includes(e.target.id)){let id=e.target.id;state.query=e.target.value;rerenderPreserve(id,state.query)}if(e.target.id==='threshold'){state.threshold=Number(e.target.value);render()}});
document.addEventListener('change',async e=>{if(e.target.id==='snapshotPicker'){state.snapshot=e.target.value;state.query='';render()}if(e.target.id==='flagPicker'){state.flag=e.target.value;render()}if(e.target.id==='csvFile'){let file=e.target.files?.[0];if(!file)return;let box=document.getElementById('importPreview');try{let content=await file.text();parsedImport=validateImport(content);box.innerHTML=previewImport(parsedImport)}catch(err){parsedImport=null;box.innerHTML=`<div class="alert warning" style="margin-top:15px"><strong>匯入驗證未通過</strong><pre style="white-space:pre-wrap;font:inherit">${esc(err.message)}</pre></div>`}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').innerHTML=''});
render();

// Official whole-market snapshots are GENERATED by scheduled scripts and loaded from
// this website's own data directory. Clicking sync cannot trigger the server job.
let activeAutoSync=false;
async function loadPublished(userInitiated=false){
  if(activeAutoSync)return;
  activeAutoSync=true;
  const status=document.getElementById('autoStatus');
  if(status)status.textContent='正在比對已發布的官方週報資料…';
  try{
    const response=await fetch('./data/auto_snapshots.json?v='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw Error('尚無可讀取的自動快照（HTTP '+response.status+'）');
    const payload=await response.json();
    if(!Array.isArray(payload.snapshots)||!payload.snapshots.length)throw Error('官方資料尚未建立，請先啟用 GitHub Actions。');
    const fresh=payload.snapshots.filter(s=>s&&s.type==='auto'&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&Array.isArray(s.records)&&s.records.length>1000);
    if(!fresh.length)throw Error('官方快照涵蓋不足，暫不取代圖片範例。');
    const previousLatest=db.snapshots.reduce((acc,s)=>s.date>acc?s.date:acc,'');
    db.snapshots=db.snapshots.filter(s=>s.type!=='auto'&&!(s.type==='built-in'&&fresh.some(f=>f.date===s.date)));
    const olddates=new Set(db.snapshots.map(s=>s.date));
    for(const s of fresh){if(!olddates.has(s.date))db.snapshots.push(s);}
    db.snapshots.sort((a,b)=>a.date.localeCompare(b.date));
    const latest=fresh[fresh.length-1];
    if(userInitiated||latest.date>=previousLatest)state.snapshot=latest.date;
    render();
    if(status){
      const incomplete=latest.records.filter(r=>r.delta==null).length;
      status.innerHTML='<strong>官方資料已同步：</strong>'+esc(latest.date)+' · 股票 '+latest.records.length+' 檔 · 週變動待累積 '+incomplete+' 檔 · 上市、上櫃定期快照。'+(latest.warnings?.length?' <span class="muted">資料來源提醒：'+esc(latest.warnings.join('；').slice(0,140))+'</span>':'');
    }
  }catch(error){
    if(status)status.innerHTML='<strong>目前尚未啟用線上自動更新：</strong>'+esc(error.message)+'。單機檔可繼續查看圖片範例、匯入 CSV；欲定期更新請先發布 GitHub Pages 並啟用排程。';
    if(userInitiated)console.warn('Published data unavailable:',error);
  }finally{activeAutoSync=false;}
}
loadPublished(false);
